name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate tag against gradle.properties
        shell: bash
        run: |
          project_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          expected_tag="v${project_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version ${project_version}" >&2
            exit 1
          fi

      - name: Build and test
        run: ./gradlew --no-daemon clean check build

      - name: Publish mod publication to GitHub Packages
        run: ./gradlew --no-daemon publishModPublicationToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release assets and checksums
        shell: bash
        run: |
          mkdir -p release-assets
          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' \
            -exec cp '{}' release-assets/ ';'
          sha256sum release-assets/*.jar > release-assets/SHA256SUMS

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-reports
          path: build/reports
          if-no-files-found: warn

      - name: Upload production mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: allthemons-ae2-watcher-optimizer
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --verify-tag --generate-notes
