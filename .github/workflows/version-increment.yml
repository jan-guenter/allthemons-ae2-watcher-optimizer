name: Version policy

on:
  pull_request:

permissions:
  contents: read

jobs:
  version-increment:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a greater semantic version
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "${BASE_REF}"
          base_version="$(
            git show "origin/${BASE_REF}:gradle.properties" |
              sed -n 's/^mod_version=//p'
          )"
          head_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          python3 - "${base_version}" "${head_version}" <<'PY'
          import re
          import sys

          pattern = re.compile(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)")
          base, head = sys.argv[1:3]
          if pattern.fullmatch(base) is None or pattern.fullmatch(head) is None:
              raise SystemExit(f"Versions must be stable SemVer x.y.z values: base={base}, head={head}")
          if tuple(map(int, head.split("."))) <= tuple(map(int, base.split("."))):
              raise SystemExit(f"mod_version must increase: base={base}, head={head}")
          print(f"mod_version increased from {base} to {head}")
          PY
