modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/jan-guenter/allthemons-ae2-watcher-optimizer/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "Jan Guenter"
displayURL = "https://github.com/jan-guenter/allthemons-ae2-watcher-optimizer"
description = '''
Dedicated-server-only interval scheduler and diagnostics for AE2 19.2.17 storage watcher censuses.
'''

[[mixins]]
config = "atmons_ae2_optimizer.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.234,21.2)"
ordering = "NONE"
side = "SERVER"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "SERVER"

[[dependencies.${mod_id}]]
modId = "ae2"
type = "required"
versionRange = "[19.2.17,19.2.18)"
ordering = "AFTER"
side = "SERVER"

[[dependencies.${mod_id}]]
modId = "extendedae"
type = "optional"
versionRange = "[1.21-2.2.33-neoforge]"
ordering = "AFTER"
side = "SERVER"

[[dependencies.${mod_id}]]
modId = "merequester"
type = "optional"
versionRange = "[1.21.1-1.4.3]"
ordering = "AFTER"
side = "SERVER"
